[package]
name = "agent-reports-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agent-reports"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
htmd = "0.5"
html5gum = "0.8.4"
markup5ever_rcdom = "0.38"
mime_guess = "2.0.5"
rand = "0.10.3"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
tokio-tungstenite = "0.29"
