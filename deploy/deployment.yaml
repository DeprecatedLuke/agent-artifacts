apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-reports
  labels:
    app: agent-reports
spec:
  replicas: 1
  # SQLite on an RWO volume: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-reports
  template:
    metadata:
      labels:
        app: agent-reports
    spec:
      imagePullSecrets:
        - name: ${AGENT_REPORTS_PULL_SECRET}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the freshly provisioned local-path volume writable for the
        # distroless nonroot user (65532).
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-reports
          # Placeholder: deploy/kustomization.yaml sets ${AGENT_REPORTS_REGISTRY}/agent-reports:<pinned tag>.
          image: agent-reports
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_REPORTS_BIND
              value: 0.0.0.0:8080
            - name: AGENT_REPORTS_DATA_DIR
              value: /data
            - name: AGENT_REPORTS_WEB_DIR
              value: /app/web
            - name: AGENT_REPORTS_RENDER_DIR
              value: /app/render
            - name: AGENT_REPORTS_GUIDE_PATH
              value: /app/docs/guide.html
            - name: AGENT_REPORTS_PUBLIC_URL
              value: ${AGENT_REPORTS_PUBLIC_URL}
            - name: AGENT_REPORTS_OWNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-reports-owner
                  key: owner-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem: SQLite needs a writable temp dir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agent-reports-data
        - name: tmp
          emptyDir: {}
