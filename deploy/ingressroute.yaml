# Route order is by explicit priority, not YAML order:
#   100 public paths   -> no auth at all (share links, render runtime, assets,
#                         health). NEVER add the remember middleware here: it
#                         would hand the session cookie to anonymous visitors.
#    50 cookie twin    -> exact remember-token cookie, refreshes the cookie,
#                         stamps the owner header.
#    10 host catch-all -> basic auth, then owner header + remember cookie.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: artifacts
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`${ARTIFACTS_HOST}`) && (PathPrefix(`/s/`) || PathPrefix(`/c/`) || PathPrefix(`/_render/`) || PathPrefix(`/assets/`) || Path(`/favicon.svg`) || Path(`/healthz`))
      kind: Rule
      priority: 100
      middlewares:
        - name: artifacts-public
      services:
        - name: artifacts
          port: 80
    - match: 'Host(`${ARTIFACTS_HOST}`) && HeaderRegexp(`Cookie`, `(^|;\s*)__Host-artifacts=${ARTIFACTS_SESSION_TOKEN}(;|$)`)'
      kind: Rule
      priority: 50
      middlewares:
        - name: artifacts-owner
        - name: artifacts-remember
      services:
        - name: artifacts
          port: 80
    - match: Host(`${ARTIFACTS_HOST}`)
      kind: Rule
      priority: 10
      middlewares:
        - name: artifacts-basic-auth
        - name: artifacts-owner
        - name: artifacts-remember
      services:
        - name: artifacts
          port: 80
  tls:
    secretName: artifacts-tls
