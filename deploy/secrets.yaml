# Secrets templated by `task deploy` (envsubst); never commit real values.
#   users:          htpasswd line generated from ARTIFACTS_BASIC_AUTH_USER/PASSWORD
#   owner-secret:   shared secret Traefik injects as X-Artifacts-Owner
apiVersion: v1
kind: Secret
metadata:
  name: artifacts-auth
type: Opaque
stringData:
  users: '${ARTIFACTS_HTPASSWD}'
---
apiVersion: v1
kind: Secret
metadata:
  name: artifacts-owner
type: Opaque
stringData:
  owner-secret: '${ARTIFACTS_OWNER_SECRET}'
