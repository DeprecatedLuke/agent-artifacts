# Secrets templated by `task deploy` (envsubst); never commit real values.
#   users:          htpasswd line generated from AGENT_REPORTS_BASIC_AUTH_USER/PASSWORD
#   owner-secret:   shared secret Traefik injects as X-Agent-Reports-Owner
apiVersion: v1
kind: Secret
metadata:
  name: agent-reports-auth
type: Opaque
stringData:
  users: '${AGENT_REPORTS_HTPASSWD}'
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-reports-owner
type: Opaque
stringData:
  owner-secret: '${AGENT_REPORTS_OWNER_SECRET}'
